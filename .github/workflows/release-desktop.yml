name: Release Desktop

# Builds and publishes the AntSeed Desktop Electron app for macOS,
# Windows, and Linux in parallel, attaching artifacts to the same GitHub
# Release (tagged v<version>, read from apps/desktop/package.json).
#
# macOS: DMG + zip, arm64 + x64, code-signed with Developer ID and
#        notarized via Apple App Store Connect API key.
# Windows: NSIS installer, x64 + arm64. Optional code signing if the
#          WIN_CSC_* secrets are set.
# Linux: AppImage + deb, x64 + arm64, unsigned. Each arch builds on a
#        native runner (ubuntu-latest / ubuntu-24.04-arm) so native
#        modules never need cross-compilation.
#
# Triggers:
#   - Manual dispatch from the Actions tab (or `gh workflow run`). Choose
#     which platforms to build via the `platforms` input.
#   - Push of a `desktop-v*` tag builds all platforms.
#
# Required repo secrets:
#   macOS:
#     MAC_CSC_LINK              base64 of a .p12 containing the Developer
#                               ID Application cert + private key
#                               (export from Keychain Access, then
#                               `base64 -i cert.p12 | pbcopy`)
#     MAC_CSC_KEY_PASSWORD      password for the .p12
#     APPLE_API_KEY_P8          contents of AuthKey_XXXXXXXXXX.p8 (paste
#                               the file contents directly into the secret,
#                               including the BEGIN/END lines)
#     APPLE_API_KEY_ID          e.g. 6JDM29LC2C
#     APPLE_API_ISSUER          issuer UUID from App Store Connect
#     APPLE_TEAM_ID             e.g. H3M5BXXQR2
#   Windows (optional, for signed installers):
#     WIN_CSC_LINK              base64 of a .pfx
#     WIN_CSC_KEY_PASSWORD      password for the .pfx
#
# Publishing auth uses the built-in GITHUB_TOKEN (contents: write).

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which platforms to build'
        type: choice
        default: all
        options:
          - all
          - mac
          - win
          - linux
      dry_run:
        description: 'Build only, do not publish to GitHub Releases'
        type: boolean
        default: false
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write  # needed for electron-builder to publish to Releases

jobs:
  mac:
    name: Build & publish macOS
    # Tag-push always runs every platform.
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'mac'
    runs-on: macos-14  # Apple Silicon; electron-builder cross-builds x64
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build monorepo (tiers 0-3)
        run: |
          pnpm run build:tier0
          pnpm run build:tier1
          pnpm run build:tier2
          pnpm run build:tier3

      - name: Write Apple API key to disk
        # electron-builder's notarization expects APPLE_API_KEY to be a
        # file path to the .p8. Write the secret contents to a temp file
        # outside the repo so it can't accidentally be packaged.
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/apple-api-key"
          mkdir -p "$key_dir"
          key_path="$key_dir/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build & publish desktop (macOS)
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder accepts base64-encoded content directly in CSC_LINK.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # APPLE_API_KEY is set via GITHUB_ENV in the previous step.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run dist:mac
          else
            npm run release:mac
          fi

      - name: Upload installers as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antseed-desktop-mac
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: warn
          retention-days: 14

  win:
    name: Build & publish Windows
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'win'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # windows-latest ships with Python + VS Build Tools, needed by
      # node-gyp to rebuild native modules against Electron's Node ABI.
      - name: Install dependencies
        run: pnpm install
        shell: pwsh

      - name: Build monorepo (tiers 0-3)
        run: |
          pnpm run build:tier0
          pnpm run build:tier1
          pnpm run build:tier2
          pnpm run build:tier3
        shell: pwsh

      - name: Build & publish desktop (Windows)
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ("${{ inputs.dry_run }}" -eq "true") {
            npm run dist:win
          } else {
            npm run release:win
          }
        shell: pwsh

      - name: Upload installers as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antseed-desktop-win
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: warn
          retention-days: 14

  linux:
    name: Build & publish Linux (${{ matrix.arch }})
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux'
    strategy:
      fail-fast: false
      matrix:
        include:
          # One native runner per arch — prepare-dist then fetches/builds
          # native modules (better-sqlite3 etc.) for the host arch, so no
          # cross-compilation is ever needed. x64 publishes latest-linux.yml,
          # arm64 publishes latest-linux-arm64.yml, so the two jobs never
          # clobber each other's updater metadata.
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build monorepo (tiers 0-3)
        run: |
          pnpm run build:tier0
          pnpm run build:tier1
          pnpm run build:tier2
          pnpm run build:tier3

      - name: Build & publish desktop (Linux ${{ matrix.arch }})
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run dist:linux
          else
            npm run release:linux
          fi

      - name: Upload installers as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antseed-desktop-linux-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest*.yml
          if-no-files-found: warn
          retention-days: 14

  # Keep the rolling `alpha` release pointing at the newest prerelease build,
  # under fixed asset names, so a single shareable link
  # (releases/download/alpha/AntSeed-VPR-alpha-arm64.dmg) always serves the
  # latest alpha. Prerelease + non-semver tag, so electron-updater and stable
  # users never see it. Runs after the platform jobs and pulls the installers
  # from the just-published versioned release (drafts included) — the local
  # build outputs are not reliable by the end of a job (the mac x64 files
  # disappear from disk), the release assets are.
  mirror-alpha:
    name: Mirror to rolling alpha release
    needs: [mac, win, linux]
    # Run when nothing failed, at least one platform published, and this is a
    # real publish (not a dry run). A platform skipped via the `platforms`
    # input must not block the mirror.
    if: >-
      !cancelled() &&
      inputs.dry_run != true &&
      needs.mac.result != 'failure' &&
      needs.win.result != 'failure' &&
      needs.linux.result != 'failure' &&
      (needs.mac.result == 'success' || needs.win.result == 'success' || needs.linux.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Mirror installers to the rolling alpha release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/desktop/package.json').version")
          case "$version" in
            *-*) ;;
            *) echo "Stable version $version — skipping alpha mirror"; exit 0 ;;
          esac
          mkdir -p alpha
          for pair in \
            "AntSeed-VPR-${version}-arm64.dmg:AntSeed-VPR-alpha-arm64.dmg" \
            "AntSeed-VPR-${version}.dmg:AntSeed-VPR-alpha.dmg" \
            "AntSeed-VPR-Setup-${version}.exe:AntSeed-VPR-Setup-alpha.exe" \
            "AntSeed-VPR-${version}-x64.AppImage:AntSeed-VPR-alpha-x64.AppImage" \
            "AntSeed-VPR-${version}-arm64.AppImage:AntSeed-VPR-alpha-arm64.AppImage" \
            "AntSeed-VPR-${version}-x64.deb:AntSeed-VPR-alpha-x64.deb" \
            "AntSeed-VPR-${version}-arm64.deb:AntSeed-VPR-alpha-arm64.deb"; do
            src="${pair%%:*}"; dst="${pair##*:}"
            if gh release download "v${version}" -p "$src" --dir alpha --clobber; then
              mv "alpha/$src" "alpha/$dst"
            else
              echo "Asset $src not on v${version} (platform skipped this run) — keeping the previous alpha copy"
            fi
          done
          if [ -z "$(ls -A alpha)" ]; then
            echo "No installers to mirror"; exit 0
          fi
          if ! gh release view alpha >/dev/null 2>&1; then
            gh release create alpha --prerelease --title "AntSeed VPR alpha (rolling)" \
              --notes "Rolling prerelease — always the latest alpha build."
          fi
          gh release upload alpha alpha/* --clobber
          gh release edit alpha --prerelease --draft=false \
            --notes "Rolling prerelease — always the latest alpha build. Currently mirrors v${version}."
