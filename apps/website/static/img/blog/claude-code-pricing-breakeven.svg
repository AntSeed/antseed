<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="ccpb-title ccpb-desc">
  <title id="ccpb-title">Claude Code pricing: monthly cost against requests per month</title>
  <desc id="ccpb-desc">A line chart comparing the flat 17 dollar per month Claude Code Pro subscription against per-token API billing. Uncached Opus 5 API cost rises steeply and crosses the subscription line at 298 requests per month. With a 90 percent prompt cache hit rate the API line rises more slowly and does not cross until 545 requests per month.</desc>

  <rect x="0" y="0" width="720" height="400" fill="#FFFFFF"/>

  <g font-family="General Sans, system-ui, sans-serif" font-size="12" fill="#001E12">

    <!-- horizontal gridlines -->
    <g stroke="#CCCDCC" stroke-width="1">
      <line x1="60" y1="350" x2="700" y2="350"/>
      <line x1="60" y1="258.6" x2="700" y2="258.6"/>
      <line x1="60" y1="167.1" x2="700" y2="167.1"/>
      <line x1="60" y1="75.7" x2="700" y2="75.7"/>
    </g>

    <!-- y axis labels -->
    <g text-anchor="end" fill="#001E12" fill-opacity="0.6">
      <text x="50" y="354">$0</text>
      <text x="50" y="262.6">$10</text>
      <text x="50" y="171.1">$20</text>
      <text x="50" y="79.7">$30</text>
    </g>

    <!-- x axis labels -->
    <g text-anchor="middle" fill="#001E12" fill-opacity="0.6">
      <text x="60" y="370">0</text>
      <text x="166.7" y="370">100</text>
      <text x="273.3" y="370">200</text>
      <text x="380" y="370">300</text>
      <text x="486.7" y="370">400</text>
      <text x="593.3" y="370">500</text>
      <text x="700" y="370">600</text>
    </g>
    <text x="380" y="391" text-anchor="middle" fill="#001E12" fill-opacity="0.6">Requests per month</text>

    <!-- Pro subscription: flat $17 -->
    <line x1="60" y1="194.6" x2="700" y2="194.6" stroke="#D79627" stroke-width="2.5"/>
    <text x="66" y="188" fill="#D79627" font-weight="600">Claude Code Pro, $17/mo flat</text>

    <!-- API, uncached Opus 5 at $0.0570 per request -->
    <line x1="60" y1="350" x2="700" y2="37.3" stroke="#001E12" stroke-width="2.5"/>
    <text x="612" y="52" text-anchor="end" fill="#001E12" font-weight="600">API, no cache</text>

    <!-- API with 90% cache hits at $0.0312 per request -->
    <line x1="60" y1="350" x2="700" y2="178.9" stroke="#10B981" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="694" y="216" text-anchor="end" fill="#0A6F4D" font-weight="600">API, 90% cache hits</text>

    <!-- crossing points -->
    <g>
      <circle cx="378.1" cy="194.6" r="5.5" fill="#FFFFFF" stroke="#001E12" stroke-width="2.5"/>
      <line x1="378.1" y1="194.6" x2="378.1" y2="350" stroke="#001E12" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.45"/>
      <text x="371" y="118" text-anchor="end" font-weight="600" font-size="13">298 requests</text>
      <text x="371" y="134" text-anchor="end" fill-opacity="0.6">breakeven, no cache</text>

      <circle cx="641.2" cy="194.6" r="5.5" fill="#FFFFFF" stroke="#0A6F4D" stroke-width="2.5"/>
      <line x1="641.2" y1="194.6" x2="641.2" y2="350" stroke="#0A6F4D" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.45"/>
      <text x="634" y="268" text-anchor="end" font-weight="600" font-size="13" fill="#0A6F4D">545 requests</text>
      <text x="634" y="284" text-anchor="end" fill="#0A6F4D" fill-opacity="0.75">breakeven, cached</text>
    </g>

    <!-- axes -->
    <line x1="60" y1="30" x2="60" y2="350" stroke="#A4A5A4" stroke-width="1.5"/>
    <line x1="60" y1="350" x2="700" y2="350" stroke="#A4A5A4" stroke-width="1.5"/>

    <text x="60" y="20" font-size="11" fill="#001E12" fill-opacity="0.5">Monthly cost, Claude Opus 5 at published rates. Request shape: 6,361 input / 1,006 output tokens.</text>
  </g>
</svg>
